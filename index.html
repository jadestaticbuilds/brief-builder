<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brief Builder — a Jade Static Builds collab</title>
<meta name="description" content="Brief an AI agent so it can run without you. Fill five fields, copy a paste-ready delegation brief.">
<meta name="theme-color" content="#04070d">
<style>
:root{
  --bg:#04070d; --surface:#0a1420; --ink:#e6fbff; --mute:#9fd8e2;
  --line:#123a4a; --accent:#00f0ff; --accent2:#ff2e88; --ink-on:#02131a;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:560px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:22px;letter-spacing:.06em;margin:0 0 4px;text-transform:uppercase}
h1 .g{background:linear-gradient(135deg,var(--accent2),var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mute);font-size:14px;margin:0 0 20px}
section{margin:0 0 16px}
label{display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--mute);margin:0 0 6px}
input[type=text],textarea{
  width:100%;background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:10px;
  padding:12px;font:inherit;min-height:48px}
textarea{min-height:88px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.decisions{display:grid;gap:8px}
.out{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:16px;white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:14px;line-height:1.6;min-height:120px;margin:0 0 12px}
.out .dim{color:var(--mute)}
button.copy{width:100%;min-height:52px;font:inherit;font-weight:700;font-size:16px;
  color:var(--ink-on);background:linear-gradient(135deg,var(--accent2),var(--accent));
  border:0;border-radius:12px;cursor:pointer}
button.copy:active{transform:scale(.99)}
button.example{width:100%;min-height:48px;font:inherit;font-size:15px;
  color:var(--accent);background:transparent;border:1px solid var(--line);
  border-radius:12px;cursor:pointer;margin:0 0 20px}
button.example:active{transform:scale(.99)}
#msg{font-size:13px;color:var(--mute);min-height:18px;margin-top:8px}
footer{color:var(--mute);font-size:12px;text-align:center;margin-top:28px}
footer a{color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1><span class="g">Brief</span> Builder</h1>
  <p class="sub">Brief an AI agent so it can run without you. Fill the fields, copy the brief, paste it to your agent.</p>
  <button class="example" id="exBtn" type="button">See an example</button>

  <section>
    <label for="fGoal">Goal</label>
    <input type="text" id="fGoal" placeholder="The one thing that must be true when it is done" autocomplete="off">
  </section>
  <section>
    <label for="fConstraints">Constraints</label>
    <textarea id="fConstraints" placeholder="Standing rules it must never break, one per line"></textarea>
  </section>
  <section>
    <label for="fCheck">Check</label>
    <textarea id="fCheck" placeholder="How you will verify it worked"></textarea>
  </section>
  <section>
    <label for="fStop">Stop</label>
    <textarea id="fStop" placeholder="Where it must not go, even if asked"></textarea>
  </section>
  <section>
    <label>3 key decisions</label>
    <div class="decisions">
      <input type="text" id="fD1" placeholder="Decision 1" autocomplete="off" aria-label="Key decision 1">
      <input type="text" id="fD2" placeholder="Decision 2" autocomplete="off" aria-label="Key decision 2">
      <input type="text" id="fD3" placeholder="Decision 3" autocomplete="off" aria-label="Key decision 3">
    </div>
  </section>
  <section>
    <label for="fScope">Scope gate</label>
    <input type="text" id="fScope" placeholder="e.g. within scope, or expands scope, needs a pick" autocomplete="off">
  </section>

  <section aria-label="Brief output">
    <label>Your brief</label>
    <div class="out" id="out" aria-live="polite"><span class="dim">Start typing above. The brief builds itself here.</span></div>
    <button class="copy" id="copyBtn" type="button">Copy brief</button>
    <p id="msg" role="status"></p>
  </section>

  <footer>A Jade Static Builds collab, built with Muse. No signup, no upload.</footer>
</main>
<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var fields = ["fGoal","fConstraints","fCheck","fStop","fD1","fD2","fD3","fScope"];
  var out = $("out"), msg = $("msg");

  function val(id){ return $(id).value.trim(); }

  function buildBrief(){
    var parts = [];
    var goal = val("fGoal");
    var cons = val("fConstraints");
    var check = val("fCheck");
    var stop = val("fStop");
    var d1 = val("fD1"), d2 = val("fD2"), d3 = val("fD3");
    var scope = val("fScope");
    if(goal) parts.push("GOAL: " + goal);
    if(cons) parts.push("CONSTRAINTS:\n" + cons);
    if(check) parts.push("CHECK: " + check);
    if(stop) parts.push("STOP: " + stop);
    var ds = [d1,d2,d3].filter(function(d){ return d.length > 0; });
    if(ds.length){
      parts.push("3 DECISIONS:\n" + ds.map(function(d,i){ return (i+1) + ". " + d; }).join("\n"));
    }
    if(scope) parts.push("SCOPE GATE: " + scope);
    return parts.join("\n\n");
  }

  function render(){
    var brief = buildBrief();
    if(brief){
      out.textContent = brief;
    }else{
      out.innerHTML = '<span class="dim">Start typing above. The brief builds itself here.</span>';
    }
  }

  fields.forEach(function(id){
    $(id).addEventListener("input", render);
  });

  function copyText(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
      return navigator.clipboard.writeText(text).then(function(){ return true; }, function(){ return fallbackCopy(text); });
    }
    return Promise.resolve(fallbackCopy(text));
  }

  function fallbackCopy(text){
    try{
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    }catch(e){
      return false;
    }
  }

  $("copyBtn").addEventListener("click", function(){
    var brief = buildBrief();
    if(!brief){
      msg.textContent = "Fill in at least one field first.";
      return;
    }
    copyText(brief).then(function(ok){
      msg.textContent = ok ? "Brief copied. Paste it to your agent." : "Copy did not work here. Select the brief above and copy it by hand.";
    });
  });

  var EXAMPLE = {
    fGoal: "Dinner for 6 guests on Saturday night, on the table by 7pm.",
    fConstraints: "One guest is vegetarian\nNo peanuts, severe allergy\nGrocery budget $80\nI get home at 5pm",
    fCheck: "Menu written by Friday night; receipt under $80; a vegetarian main on the menu",
    fStop: "No recipes needing special equipment; no new dishes after Friday",
    fD1: "Main dish: mushroom risotto or eggplant parmesan",
    fD2: "Store-bought dessert to save time",
    fD3: "Serve buffet-style, no plated courses",
    fScope: "Within scope: 3 dishes and a dessert. Anything more needs a cut."
  };

  $("exBtn").addEventListener("click", function(){
    var has = fields.some(function(id){ return val(id).length > 0; });
    if(has && !window.confirm("Replace what you have typed with the example?")) return;
    fields.forEach(function(id){ $(id).value = EXAMPLE[id] || ""; });
    render();
    msg.textContent = "Example loaded. Edit it, or clear the fields to start fresh.";
  });

  render();
})();
</script>
</body>
</html>
